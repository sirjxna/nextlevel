server {
  listen 8080 default_server;
  server_name _;
  root /var/www/vestmotor;
  index index.html;

  location / {
    try_files $uri $uri/ =404;
  }

  # Cache static assets
  location ~* \.(?:css|js|png|jpg|jpeg|webp|avif|svg|json)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }
}
